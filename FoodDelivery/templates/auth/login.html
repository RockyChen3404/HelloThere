{% extends "base.html" %}
{% block title %}登录 - FoodDelivery{% endblock %}

{% block content %}
<div class="container" style="max-width:420px;margin-top:60px;">
  <div class="card">
    <div class="card-body">
      <h2 style="text-align:center;margin-bottom:24px;color:#ff4400;">🍜 登录</h2>
      <div id="err" class="alert alert-error" style="display:none;"></div>
      <div class="form-group">
        <label>手机号</label>
        <input type="tel" id="phone" placeholder="请输入手机号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">登录</button>
      <p style="text-align:center;margin-top:16px;font-size:14px;color:#888;">
        还没有账号？<a href="/register" style="color:#ff4400;">立即注册</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function doLogin() {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const data = await apiFetch('/auth/login', 'POST', { phone, password });
    const role = data.user.role;
    if (role === 'merchant') location.href = '/dashboard/merchant';
    else if (role === 'rider') location.href = '/dashboard/rider';
    else location.href = '/';
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
{% endblock %}
